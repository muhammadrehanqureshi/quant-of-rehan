name: Market email notifications

# Owner order 2026-10-22: the market event notifications travel to the
# owner's GitHub connected address (mrmrehanqureshi@gmail.com) as email,
# from GitHub Actions, right on time. A comment on the watched owner
# email issue IS the email: GitHub mails the owner the moment the
# comment is written. The texts are the owner's exact sentences and the
# windows are the session law (SO-8); scripts/market_email.py refuses a
# window the event does not belong to, and the comment ledger on the
# issue keeps each event exactly once per Karachi day.
#
# The crons name the minutes the law knows:
#
#   04:15 UTC = 09:15 PKT  pre market, Mon-Thu (owner order 2026-10-26: the
#                          pre market opens at 09:15, so the email fires
#                          there, not at 09:00)
#   04:00 UTC = 09:00 PKT  pre market, Friday band shape (unchanged)
#   04:30 UTC = 09:30 PKT  morning break, Mon-Thu (owner order 2026-10-27:
#                          the 2-minute gap before the 09:32 open)
#   04:15 UTC = 09:15 PKT  morning break, Friday (the same order: the
#                          gap before the 09:17 open)
#   04:32 UTC = 09:32 PKT  open, Mon-Thu band
#   04:17 UTC = 09:17 PKT  open, Friday band 1
#   07:00 UTC = 12:00 PKT  break, Friday midday
#   09:32 UTC = 14:32 PKT  reopen, Friday band 2
#   10:30 UTC = 15:30 PKT  close, Mon-Thu
#   11:30 UTC = 16:30 PKT  close, Friday
#   10:32 UTC = 15:32 PKT  post market, Mon-Thu
#   11:32 UTC = 16:32 PKT  post market, Friday
#   10:49 UTC = 15:49 PKT  post-close, Mon-Thu (owner order 2026-10-24)
#   11:49 UTC = 16:49 PKT  post-close, Friday
#
# Owner order 2026-10-24 ("Make my system reliable"): on 2026-10-23 the
# close job was delivered 4.5 hours late and emailed at 20:50, and the
# post-market jobs never ran. fire() now refuses a fire far past the
# event's own minute, the catch-up backstop below tightened from every
# quarter hour to every 5 minutes, and the trailing post-close edges
# got their own two crons and jobs. The per-event jobs stay exactly as
# they were: first to land wins, the rest are no-ops.
#
# Owner order 2026-10-23 ("sync with relex: the abortascade had killed
# cron scheduling"): on 2026-10-22 the queued crons fired 5 hours late
# and on 2026-10-23 the break and reopen crons never fired at all. The
# catch-up fire below is the backstop for exactly that: every 5
# minutes, inside the session hours, it walks the day's roadmap
# (scripts/market_email.py --catch-up) and emails whatever event's own
# minute passed within the grace and is still missing from the ledger
# (the ledger keeps it exactly once across every path). A missed event
# is therefore in someone's hands within 5 minutes, never 15.
#
# One schedule entry fires the whole workflow, so every job below gates
# itself on the fired cron line: only the job that owns that minute
# sends. The steps are spelled out per job instead of anchored, which is
# the house style of every other workflow in this repo. A signal call
# does not come from here: the session loop's own push
# (intraday_pipeline) emails the actual calls from the band job.

on:
  schedule:
    # Pre market: 09:15 PKT Monday to Thursday (owner order 2026-10-26),
    # 09:00 PKT Friday where the earlier orders left it.
    - cron: "15 4 * * 1-4"
    - cron: "0 4 * * 5"
    - cron: "30 4 * * 1-4"     # morning break, Mon-Thu (owner 2026-10-27)
    - cron: "15 4 * * 5"       # morning break, Friday (owner 2026-10-27)
    - cron: "32 4 * * 1-4"     # open, Mon-Thu
    - cron: "17 4 * * 5"       # open, Friday
    - cron: "0 7 * * 5"        # break, Friday
    - cron: "32 9 * * 5"       # reopen, Friday
    - cron: "30 10 * * 1-4"    # close, Mon-Thu
    - cron: "30 11 * * 5"      # close, Friday
    - cron: "32 10 * * 1-4"    # post market, Mon-Thu
    - cron: "32 11 * * 5"      # post market, Friday
    - cron: "49 10 * * 1-4"    # post-close, Mon-Thu
    - cron: "49 11 * * 5"      # post-close, Friday
    # The catch-up backstop (owner order 2026-10-24): every 5 minutes
    # from 09:00 to 17:55 PKT, walk the day's event roadmap and email
    # what a late or dead cron above missed inside the 15 minute grace.
    # The ledger keeps each event exactly once across every path, and a
    # missed event is picked up within 5 minutes of its own edge.
    - cron: "*/5 4-12 * * 1-5"
  workflow_dispatch:
    inputs:
      event:
        description: "which event to email now (pre, morning-break, open, break, close, post, post-close, catch-up)"
        default: "open"

# A dispatch emails one chosen event, so every job also names the event
# it owns and a dispatch starts exactly one job instead of nine.

# The email IS an issue comment written on the owner's watched issue (81);
# a workflow token is read-only by default since the token hardening, so
# the write permission is granted here or the POST lands as a 403 and the
# bell stays silent twice over.
permissions:
  issues: write

env:
  OWNER_EMAIL_ISSUE: "81"

jobs:
  # The catch-up backstop: every 5 minutes, walk the morning-to-close
  # roadmap and email what the per-event crons above missed inside the
  # grace window. The ledger on the watched issue keeps each event
  # exactly once across this job, the per-event jobs and the session
  # loop's own passenger (src/notify/market_watch.py).
  catch_up:
    if: (github.event_name == 'schedule' && github.event.schedule == '*/5 4-12 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.event == 'catch-up')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The email path speaks GitHub over requests (src/notify/owner_email.py);
      # the missing install is what clipped every event on 2026-10-22, so the
      # module is bought here, the same way the other workflows buy theirs.
      - run: pip install requests --retries 5 --timeout 60
      - name: Email whatever the day's crons missed, inside the grace
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER_EMAIL_ISSUE: "81"
        run: python scripts/market_email.py --catch-up

  pre:
    if: (github.event_name == 'schedule' && (github.event.schedule == '15 4 * * 1-4' || github.event.schedule == '0 4 * * 5')) || (github.event_name == 'workflow_dispatch' && inputs.event == 'pre')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT: pre
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The email path speaks GitHub over requests (src/notify/owner_email.py);
      # the missing install is what clipped every event on 2026-10-22, so the
      # module is bought here, the same way the other workflows buy theirs.
      - run: pip install requests --retries 5 --timeout 60
      - name: Email the pre-open when the session law says it is due
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/market_email.py --event "${{ inputs.event }}"
          else
            python scripts/market_email.py --event "$EVENT"
          fi

  morning_break_weekday:
