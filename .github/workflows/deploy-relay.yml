name: Deploy the Telegram relay worker

# The relay is one Worker plus one KV binding, deployed from cloud/ with
# wrangler. Nothing in a GitHub runner is secret beyond the deploy token, so
# the token and the account id ride as repository secrets; the KV namespace
# id is a repository VARIABLE (an identifier, not a credential). wrangler.toml
# keeps its placeholder in git on purpose (SO-5: the repo carries no live
# identifiers), and this workflow substitutes it at deploy time.
#
# Minutes law (SO-13): deploys are seconds, run only when cloud/ changes or
# by hand, and never overlap the scanner band windows. On success this
# verifies the live edge answers /health, because a deploy that installs a
# broken worker is worse than no deploy.

on:
  push:
    branches: [master]
    paths: ["cloud/**", ".github/workflows/deploy-relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the deploy credentials are set
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; }
          [ -n "${{ vars.RELAY_KV_ID }}" ] || { echo "::error::RELAY_KV_ID variable missing"; exit 1; }

      - name: Install wrangler
        run: npm install --no-save wrangler@latest

      - name: Substitute the KV namespace id from the repo variable
        working-directory: cloud
        run: |
          cp wrangler.toml wrangler.toml.bak
          sed -i "s/PASTE_KV_NAMESPACE_ID_AFTER_CREATION/${{ vars.RELAY_KV_ID }}/" wrangler.toml
          grep -q "${{ vars.RELAY_KV_ID }}" wrangler.toml

      # Three attempts, because the Cloudflare management API has returned a
      # transient failure at this exact step before (run 39225627067: the same
      # token, account and KV id deployed green at 07:32 and answered
      # 10041 "namespace not found" at 08:55). The retry costs twenty seconds
      # inside a ten minute budget; the alternative is a red X on a push that
      # never reached the edge.
      - name: Deploy
        working-directory: cloud
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --var WORKER_VERSION:${{ github.sha }}; then
              exit 0
            fi
            echo "::warning::wrangler deploy failed (attempt ${attempt} of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error::wrangler deploy failed three times; the edge still runs the previous build"
          exit 1

      # A deploy is not done when the upload returns, it is done when the edge
      # answers with the commit just built. /health carries that commit as
      # `version`; a worker uploaded outside CI reports null and passes with a
      # warning, so cloud/pair.py uploads stay valid.
      - name: Verify the live edge runs this commit
        run: |
          want="${GITHUB_SHA}"
          for _ in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 30 \
              https://quant-of-rehan-relay.mrmrehanqureshi.workers.dev/health || true)
            if ! printf '%s' "$body" | grep -q '"ok": true'; then
              sleep 10
              continue
            fi
            got=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version") or "")')
            if [ "$got" = "$want" ]; then
              echo "live /health reports version $want"
              exit 0
            fi
            if [ -z "$got" ]; then
              echo "::warning::live /health carries no version; the edge answered but this run cannot prove it was replaced"
              exit 0
            fi
            echo "edge still reports ${got:0:12}, waiting for $want"
            sleep 10
          done
          echo "::error::the edge did not switch to this commit; the deploy did not land"
          exit 1

      - name: Say what to check when the deploy is refused
        if: failure()
        run: |
          echo "::error::A Cloudflare deploy refusal is a credential or namespace problem, not a code problem. Check, in order: (1) KV namespace ${{ vars.RELAY_KV_ID }} still exists, (2) CLOUDFLARE_API_TOKEN has Workers Scripts: Edit and Workers KV Storage: Read on the account in CLOUDFLARE_ACCOUNT_ID, (3) RELAY_KV_ID was not left pointing at a namespace that was deleted and recreated."

      - name: Restore the placeholder so nothing invalid lands in the repo
        if: always()
        working-directory: cloud
        run: |
          mv -f wrangler.toml.bak wrangler.toml 2>/dev/null || true
          git checkout -- ../cloud/wrangler.toml 2>/dev/null || true
