name: Build the Windows terminal

# The desktop terminal is packaged on a Windows runner so the artifact is a
# real Windows executable, not a cross-build. Manual dispatch and any merge
# that touches the desktop source.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/desktop/**"
      - "packaging/**"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build the icon from the brand logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("assets/quant-of-rehan-logo.png")
          target = Path("assets/quant-of-rehan.ico")
          image = Image.open(source).convert("RGBA")
          image.save(target, sizes=[(256, 256), (128, 128), (64, 64), (32, 32), (16, 16)])
          print(f"icon written: {target} ({target.stat().st_size} bytes)")
          PY

      - name: Package with PyInstaller
        run: python -m PyInstaller --noconfirm packaging/quant_of_rehan.spec

      - name: Smoke the packaged executable
        run: dist/QuantOfRehan/QuantOfRehan.exe --smoke

      - name: Zip the distribution
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive("Quant-of-Rehan-Windows-x64", "zip", "dist", "QuantOfRehan")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Quant-of-Rehan-Windows-x64
          path: Quant-of-Rehan-Windows-x64.zip
          retention-days: 30
