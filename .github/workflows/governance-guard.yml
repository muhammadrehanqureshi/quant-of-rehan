# GOVERNANCE GUARD — runs ONLY on pull requests, finishes in seconds.
# SO-4: no scheduled jobs, no backtests, no data pipelines in Actions.
# Monthly budget protection: this workflow consumes well under 1 minute per PR.
name: governance-guard

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Governance check (secrets, footprint honesty, standing orders)
        run: python scripts/check_governance.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
