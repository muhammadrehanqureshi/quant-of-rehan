# GOVERNANCE GUARD: runs ONLY on pull requests, finishes in seconds.
# SO-4: no scheduled jobs, no backtests, no data pipelines in Actions.
# Monthly budget protection: this workflow consumes well under 1 minute per PR.
name: governance-guard

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # fetch-depth: 0 lets the SO-7 check read PR commit authors/messages.
      # The ref is the PR's own head commit on purpose. The default checkout
      # takes GitHub's synthetic test merge commit, which is authored as the
      # head commit's author and carries no message of its own, so judging it
      # would fail every pull request under SO-7a without saying anything
      # about the work inside it. The commits the PR itself adds are the ones
      # the standards apply to, and those are exactly what this checks out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # SO-7 and SO-7a: verify every PR commit is authored by the owner,
      # carries the agent's co-author line exactly once, and holds no other
      # trailer and no banned dash character in the message.
      - name: Governance check (secrets, style, identity, standing orders)
        env:
          GOVERN_COMMIT_RANGE: origin/master..HEAD
        run: python scripts/check_governance.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Cloudflare worker syntax
        run: node --input-type=module --check < cloud/worker.js
