name: Relay budget guard

# Owner order 2026-11-03: the relay must not consume the Cloudflare
# Durable Objects row budget in silence. The worker records its flow
# backup count in FLOW:STATS; this check reads it during the PSX session
# and sends one deduped owner email at 80 percent or exhaustion.
on:
  schedule:
    # 4-11 UTC is 09:00 to 16:59 PKT. The hour 11 fires at 16:00 and 16:30 are
    # inside Friday's second band (14:32 to 16:30), which the audit of
    # 2026-11-23 found unwatched; the guard's own 09:00 and 15:50 filters make
    # the extra Mon-Thu wakes cost a checkout and nothing else.
    - cron: "0,30 4-11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Check the flow backup budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > /tmp/relay_budget_message
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from src.data.relay_http import read_json

          now = datetime.now(ZoneInfo("Asia/Karachi"))
          minute = now.hour * 60 + now.minute
          # Owner order 2026-11-12: the budget is only at risk while the day's
          # tape is running. A scheduled fire GitHub delivers after 15:50 PKT
          # is a late fire, not a relay fault, so it must not email the owner.
          if minute < 9 * 60 or minute >= 15 * 60 + 50:
              raise SystemExit(0)

          # Owner report 2026-11-11: an email every day after the close that
          # said only "could not read /health: HTTPError". One busy instant on
          # the edge is not an outage: the guard now tries the same route three
          # times before it says anything, and it no longer reports a single
          # failed read of one route as if the relay were down. The alert names
          # the attempts, so the message states what was actually observed.
          BASE = "https://quant-of-rehan-relay.mrmrehanqureshi.workers.dev"

          # Owner report 2026-11-12: the readiness mail called an edge refusal
          # (HTTP 403, the default Python user agent) a dead relay. Every read
          # here goes through src/data/relay_http.py, which sends the project's
          # browser style prefix and names the status and body it saw.
          health, health_trouble = read_json(BASE, "/health", attempts=3)
          if health is None:
              print(
                  "Quant of Rehan relay budget guard could not read /health "
                  f"after three attempts ({health_trouble}). The relay was "
                  "not changed and no budget is implicated by this check. "
                  "This alert repeats at most once per day."
              )
              raise SystemExit(0)

          quotes, quotes_trouble = read_json(BASE, "/quotes", attempts=3)
          if quotes is None:
              print(
                  "Quant of Rehan relay feed check could not read /quotes "
                  f"after three attempts ({quotes_trouble}). The relay was "
                  "not changed. This alert repeats at most once per day."
              )
              raise SystemExit(0)
          if health.get("market_open") and (
                  not (quotes.get("quotes") or []) or quotes.get("stale")):
              print(
                  "Quant of Rehan relay feed is empty or stale while the market is open. "
                  "The relay cap or the publisher needs attention. This alert repeats "
                  "at most once per day."
              )
              raise SystemExit(0)

          messages = []

          budget = health.get("flow_budget") or {}
          rows = budget.get("rows_written_today")
          limit = budget.get("row_budget")
          if (isinstance(rows, (int, float))
                  and isinstance(limit, (int, float)) and limit > 0
                  and (rows >= limit * 0.8 or budget.get("exhausted"))):
              messages.append(
                  "Quant of Rehan relay flow backup budget is at "
                  f"{rows}/{limit} rows today ({rows / limit:.0%}). The live "
                  "feed remains untouched, but flow state backups may pause. "
                  f"Cloudflare day {budget.get('day')}; last flush "
                  f"{budget.get('last_flush')}. This alert repeats at most "
                  "once per day."
              )

          # Owner report 2026-11-27: the Durable Object budget reached 90
          # percent of the free plan's 100,000 requests in one day. The hub
          # now counts every request it answers and /health carries the
          # measured number, so this guard warns at 70 percent, while there is
          # still a session left to save.
          do_requests = health.get("do_requests") or {}
          spent = do_requests.get("requests_today")
          do_limit = health.get("do_requests_limit")
          if (isinstance(spent, (int, float))
                  and isinstance(do_limit, (int, float)) and do_limit > 0
                  and spent >= do_limit * 0.7):
              messages.append(
                  "Quant of Rehan relay Durable Objects budget is at "
                  f"{spent}/{do_limit} requests today "
                  f"({spent / do_limit:.0%}) of the free plan's daily cap. "
                  "The relay brakes its own reads at 80 percent; at the cap "
                  "the feed stops until 00:00 UTC. Cloudflare day "
                  f"{do_requests.get('day')}. This alert repeats at most once "
                  "per day."
              )

          if not messages:
              raise SystemExit(0)
          print(" ".join(messages))
          PY
          if [ -s /tmp/relay_budget_message ]; then
            python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from src.notify.owner_email import send

          text = Path("/tmp/relay_budget_message").read_text(encoding="utf-8").strip()
          if text:
              day = datetime.now(ZoneInfo("Asia/Karachi")).date().isoformat()
              send(text, f"relay-budget:{day}")
          PY
          fi
