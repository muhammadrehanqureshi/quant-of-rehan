name: Relay budget guard

# Owner order 2026-11-03: the relay must not consume the Cloudflare
# Durable Objects row budget in silence. The worker records its flow
# backup count in FLOW:STATS; this check reads it during the PSX session
# and sends one deduped owner email at 80 percent or exhaustion.
on:
  schedule:
    - cron: "0,30 4-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Check the flow backup budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > /tmp/relay_budget_message
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Karachi"))
          minute = now.hour * 60 + now.minute
          # Owner order 2026-11-12: the budget is only at risk while the day's
          # tape is running. A scheduled fire GitHub delivers after 15:50 PKT
          # is a late fire, not a relay fault, so it must not email the owner.
          if minute < 9 * 60 or minute >= 15 * 60 + 50:
              raise SystemExit(0)

          # Owner report 2026-11-11: an email every day after the close that
          # said only "could not read /health: HTTPError". One busy instant on
          # the edge is not an outage: the guard now tries the same route three
          # times before it says anything, and it no longer reports a single
          # failed read of one route as if the relay were down. The alert names
          # the attempts, so the message states what was actually observed.
          BASE = "https://quant-of-rehan-relay.mrmrehanqureshi.workers.dev"

          def read(path, attempts=3):
              last = None
              for _ in range(attempts):
                  try:
                      with urllib.request.urlopen(BASE + path, timeout=20) as response:
                          return json.load(response)
                  except Exception as exc:  # noqa: BLE001 - named in the alert
                      last = exc
              return {"__error__": type(last).__name__ if last else "unknown"}

          health = read("/health")
          if "__error__" in health:
              print(
                  "Quant of Rehan relay budget guard could not read /health "
                  f"after three attempts ({health['__error__']}). The relay was "
                  "not changed and no budget is implicated by this check. "
                  "This alert repeats at most once per day."
              )
              raise SystemExit(0)

          quotes = read("/quotes")
          if "__error__" in quotes:
              print(
                  "Quant of Rehan relay feed check could not read /quotes "
                  f"after three attempts ({quotes['__error__']}). The relay was "
                  "not changed. This alert repeats at most once per day."
              )
              raise SystemExit(0)
          if health.get("market_open") and (
                  not (quotes.get("quotes") or []) or quotes.get("stale")):
              print(
                  "Quant of Rehan relay feed is empty or stale while the market is open. "
                  "The relay cap or the publisher needs attention. This alert repeats "
                  "at most once per day."
              )
              raise SystemExit(0)

          budget = health.get("flow_budget") or {}
          rows = budget.get("rows_written_today")
          limit = budget.get("row_budget")
          if (not isinstance(rows, (int, float))
                  or not isinstance(limit, (int, float))
                  or limit <= 0):
              raise SystemExit(0)
          if rows < limit * 0.8 and not budget.get("exhausted"):
              raise SystemExit(0)
          print(
              "Quant of Rehan relay flow backup budget is at "
              f"{rows}/{limit} rows today ({rows / limit:.0%}). The live "
              "feed remains untouched, but flow state backups may pause. "
              f"Cloudflare day {budget.get('day')}; last flush "
              f"{budget.get('last_flush')}. This alert repeats at most "
              "once per day."
          )
          PY
          if [ -s /tmp/relay_budget_message ]; then
            python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from src.notify.owner_email import send

          text = Path("/tmp/relay_budget_message").read_text(encoding="utf-8").strip()
          if text:
              day = datetime.now(ZoneInfo("Asia/Karachi")).date().isoformat()
              send(text, f"relay-budget:{day}")
          PY
          fi
