# Secret scan: every push and PR is scanned for credentials.
# Values are never printed: --redact removes the matched content from output.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: "one-off sweep of the ENTIRE git history (mission order)"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write   # gitleaks posts its findings comment on PRs

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # A dispatched run sweeps every commit since the first one; the
          # push and PR scans keep their per-event behaviour.
          GITLEAKS_ENABLE_FULL_HISTORY: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_history && 'true' || 'false') }}
