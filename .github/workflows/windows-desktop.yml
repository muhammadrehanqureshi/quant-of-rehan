name: Windows desktop

on:
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [master]
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Draw the HUD dial icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/mkicon_hud.py assets/QuantOfRehan.ico assets/icon-1024.png
          python tools/mksyso.py assets/QuantOfRehan.ico rsrc_windows_amd64.syso 4.0.16.20
      - name: Check the icon has rounded corners
        run: |
          python -c "from PIL import Image; im=Image.open('assets/icon-1024.png').convert('RGBA'); assert all(im.getpixel(xy)[3] <= 8 for xy in ((0,0),(1023,0),(0,1023),(1023,1023))), 'icon corners must be transparent'; assert im.getpixel((512,512))[3] == 255, 'icon centre must be opaque'"
      - name: Test
        run: go test ./...
      - name: Build the console executable
        run: go build -trimpath -ldflags "-s -w -buildid=" -o QuantOfRehan.exe .
      - name: Extract the icon the exe carries
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\QuantOfRehan.exe")
          $icon.ToBitmap().Save("$PWD\exe-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
      - name: Package the runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item QuantOfRehan.exe, assets/QuantOfRehan.ico, README.md package
          Get-FileHash QuantOfRehan.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  QuantOfRehan.exe" } |
            Set-Content package/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QuantOfRehan-windows
          path: windows/package
      - uses: actions/upload-artifact@v4
        with:
          name: QuantOfRehan-icon
          path: windows/assets/icon-1024.png
      - uses: actions/upload-artifact@v4
        with:
          name: QuantOfRehan-exe-icon
          path: windows/exe-icon.png
