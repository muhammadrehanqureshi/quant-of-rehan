# SO-21 (owner order 2026-10-19): backtests run here, never on the owner's PC.
#
# Manual dispatch only. A schedule would turn a backtest into a cadence nobody
# asked for, and check_backtests_in_cloud fails the pull request that adds one.
# The repository is public, so these minutes cost nothing; the constraint the
# owner set is his machine's heat, which this job does not touch.
#
# The dataset is never committed (`/data/` is gitignored), so the crawl that
# builds it lives here too. A run that needs the dataset and does not build it
# stops with a clear message instead of inventing data (SO-3).
name: backtest

on:
  workflow_dispatch:
    inputs:
      task:
        description: "what to run"
        type: choice
        options: [both, smoke, build-dataset, ten-year, mean-reversion, kalman-grid, eleven, forensic, quality, self-improve, breakthrough]
        default: both
      prior_trials:
        description: "trials already spent in this search program"
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    # ten-year: the mkt_summary crawl walks ~2,600 weekday slots politely
    # before any engine work starts, so this job may genuinely need the
    # larger ceiling; the five-year option never comes close.
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      # KMIALL EOD over the five years the engine walks. One polite pass over
      # the 319 symbol universe, written to the gitignored data/ directory.
      - name: Build the dataset
        if: inputs.task == 'both'
        run: |
          mkdir -p data
          python -m src.data.psx_eod \
            --universe src/data/universe_kmiall.json \
            --out data/eod_dataset.csv.gz \
            --cache-dir data/raw_eod

      - name: Refuse to run without a dataset
        if: inputs.task == 'smoke'
        run: |
          if [ ! -f data/eod_dataset.csv.gz ]; then
            echo "::error::data/eod_dataset.csv.gz is missing. Dispatch with task=both (or build-dataset) first; the dataset is gitignored and this job does not invent one."
            exit 1
          fi

      - name: Smoke the engine end to end
        if: inputs.task == 'both' || inputs.task == 'smoke'
        run: |
          python scripts/smoke_backtest.py \
            --dataset data/eod_dataset.csv.gz \
            --out data/backtest_smoke.json
          cat data/backtest_smoke.json

      - name: Keep the result
        if: inputs.task == 'both' || inputs.task == 'smoke'
        uses: actions/upload-artifact@v7
        with:
          name: backtest-${{ github.run_id }}
          path: data/backtest_smoke.json
          if-no-files-found: error
          retention-days: 30

      # Ten-year proof base (owner order 2026-10-29): full OHLCV from the
      # mkt_summary daily archive, scored by the SAME component weights the
      # deployed scanner carries, simulated by the same engine the five
      # year smoke uses. Manual dispatch only (SO-21): no schedule here.
      - name: Build the ten-year dataset
        if: inputs.task == 'ten-year'
        run: |
          mkdir -p data
          python scripts/build_backtest_dataset.py \
            --universe src/data/universe_kmiall.json \
            --start 2016-10-29 \
            --out data/eod_dataset_10y.csv.gz \
            --cache-dir data/mkt_cache

      - name: Run the ten-year backtest
        if: inputs.task == 'ten-year'
        run: |
          python scripts/backtest_10y.py \
            --dataset data/eod_dataset_10y.csv.gz \
            --out data/backtest_10y_report.json
          cat data/backtest_10y_report.json

      - name: Keep the ten-year result
        if: inputs.task == 'ten-year'
        uses: actions/upload-artifact@v7
        with:
          name: backtest-ten-year-${{ github.run_id }}
          path: |
            data/backtest_10y_report.json
            data/backtest_10y_report_trades.csv
            data/eod_dataset_10y.summary
          if-no-files-found: error
          retention-days: 30

  # Mean-reversion (RSI(2) snapback) study under the MeanRevParams exit
  # law, scored and simulated against the same ten-year mkt_summary
  # panel the 'ten-year' task uses. Manual dispatch only (SO-21), and only
  # when that task is the one asked for: before this guard every dispatch
  # (including the Kalman grid) also started this ten-year crawl, which is
  # a runner-minute burn nobody asked for.
  mean-reversion:
    if: inputs.task == 'mean-reversion'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Build the ten-year dataset
        run: |
          mkdir -p data
          python scripts/build_backtest_dataset.py \
            --universe src/data/universe_kmiall.json \
            --start 2016-10-29 \
            --out data/eod_dataset_10y.csv.gz \
            --cache-dir data/mkt_cache

      - name: Run the mean-reversion backtest
        run: |
          python scripts/backtest_mean_reversion.py \
            --dataset data/eod_dataset_10y.csv.gz \
            --out data/backtest_mean_reversion_report.json
          cat data/backtest_mean_reversion_report.json

      - name: Keep the mean-reversion result
        uses: actions/upload-artifact@v7
        with:
          name: backtest-mean-reversion-${{ github.run_id }}
          path: |
            data/backtest_mean_reversion_report.json
            data/backtest_mean_reversion_report_trades.csv
            data/eod_dataset_10y.summary
          if-no-files-found: error
          retention-days: 30

  # The Kalman Trend's parameter grid (owner order 2026-10-30): the owner's
  # answer 2 - the numbers are chosen by a grid-fit in Actions, never on
  # his PC. Input: this repository's own captured tape sessions, which are
  # gitignored and therefore never in a checkout: the job fetches them from
  # the R2 band store the session jobs push to (the same two repo secrets
  # the session workflow already carries). With no session in the store the
  # script exits 1 rather than invent evidence (SO-3). Manual dispatch only
  # (SO-21).
  kalman-grid:
    if: inputs.task == 'kalman-grid'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Collect the band store sessions and fit the Kalman grid
        run: |
          python scripts/kalman_grid_fit.py \
            --input 'data/feed_capture/capture_*.ndjson' \
            --from-store 20 \
            --out data/research/kalman_grid.json
          cat data/research/kalman_grid.json

      - name: Keep the grid result
        uses: actions/upload-artifact@v7
        with:
          name: kalman-grid-${{ github.run_id }}
          path: data/research/kalman_grid.json
          if-no-files-found: error
          retention-days: 90

  # The owner's eleven-strategy intraday study (2026-11-08): the current
  # Kalman flip plus the nine rules the captured tape can support. The
  # sessions live in the R2 band store, never in a checkout. The 3-year
  # daily panel is built for the target-feasibility context only; the
  # intraday result is the stored-session sample and says so. Manual
  # dispatch only (SO-21).
  eleven:
    if: inputs.task == 'eleven'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Replay the stored intraday sessions
        run: |
          python scripts/backtest_eleven_intraday.py \
            --input 'data/feed_capture/capture_*.ndjson' \
            --from-store 20 \
            --out data/research/eleven_intraday.json \
            --trades data/research/eleven_intraday_trades.csv
          cat data/research/eleven_intraday.json

      - name: Keep the intraday result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eleven-intraday-${{ github.run_id }}
          path: |
            data/research/eleven_intraday.json
            data/research/eleven_intraday_trades.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Restore the ten-year panel
        id: panel
        uses: actions/cache/restore@v4
        with:
          path: data/eod_dataset_10y.csv.gz
          key: eod-10y-${{ hashFiles('src/data/universe_kmiall.json') }}-2016-10-29-v1

      - name: Build the ten-year panel
        if: steps.panel.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          python scripts/build_backtest_dataset.py \
            --universe src/data/universe_kmiall.json \
            --start 2016-10-29 \
            --out data/eod_dataset_10y.csv.gz \
            --cache-dir data/mkt_cache

      - name: Save the ten-year panel
        if: steps.panel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/eod_dataset_10y.csv.gz
          key: eod-10y-${{ hashFiles('src/data/universe_kmiall.json') }}-2016-10-29-v1

      - name: Measure the three-year daily target context
        run: |
          python scripts/backtest_eleven_context.py \
            --dataset data/eod_dataset_10y.csv.gz \
            --out data/research/eleven_daily_context.json
          cat data/research/eleven_daily_context.json

      - name: Keep the daily context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eleven-daily-context-${{ github.run_id }}
          path: data/research/eleven_daily_context.json
          if-no-files-found: warn
          retention-days: 90

  # The owner's forensic audit of the eleven-strategy study (2026-11-08).
  # It runs the original replay for reconciliation, an execution-only corrected
  # replay and a strict-data replay, then writes the audit, the corrected
  # ledgers and the per-session quality evidence. Research only: no live
  # signal, target, stop, notification, broker or Android change. Manual
  # dispatch only (SO-21); the sessions come from the R2 band store.
  forensic:
    if: inputs.task == 'forensic'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Run the forensic audit
        run: |
          python scripts/backtest_forensic_audit.py \
            --input 'data/feed_capture/capture_*.ndjson' \
            --from-store 20 \
            --out data/research/backtest_forensic_audit.json \
            --trades data/research/eleven_corrected_trades.csv \
            --execution-trades data/research/eleven_execution_corrected_trades.csv \
            --quality data/research/intraday_data_quality.json \
            --performance data/research/eleven_corrected_performance.json \
            --audit-report INTRADAY_BACKTEST_FORENSIC_AUDIT.md \
            --performance-report reports/2026-11-08-eleven-strategy-intraday-corrected.md \
            --quality-report reports/2026-11-08-intraday-data-quality.md
          cat data/research/backtest_forensic_audit.json

      - name: Keep the forensic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intraday-forensic-${{ github.run_id }}
          path: |
            INTRADAY_BACKTEST_FORENSIC_AUDIT.md
            reports/2026-11-08-eleven-strategy-intraday-corrected.md
            reports/2026-11-08-intraday-data-quality.md
            data/research/backtest_forensic_audit.json
            data/research/eleven_corrected_trades.csv
            data/research/eleven_execution_corrected_trades.csv
            data/research/intraday_data_quality.json
            data/research/eleven_corrected_performance.json
          if-no-files-found: warn
          retention-days: 90

  # The lightweight data-quality monitor for the research branch. It performs
  # the raw capture audit and the session completeness count only, so it can
  # run after every capture block without replaying a strategy. Manual
  # dispatch only (SO-21).
  quality:
    if: inputs.task == 'quality'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Measure the stored sessions
        run: |
          python scripts/backtest_forensic_audit.py \
            --input 'data/feed_capture/capture_*.ndjson' \
            --from-store 20 \
            --quality-only \
            --quality data/research/intraday_data_quality.json \
            --quality-report reports/2026-11-08-intraday-data-quality.md
          cat data/research/intraday_data_quality.json

      - name: Keep the quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intraday-quality-${{ github.run_id }}
          path: |
            reports/2026-11-08-intraday-data-quality.md
            data/research/intraday_data_quality.json
          if-no-files-found: warn
          retention-days: 90

  # The self-improvement mission's ONE command (owner order): the
  # pre-registered search over the ten-year mkt_summary panel, the
  # champion read back through the registry as the same code hash that
  # produced it, and the live outcomes' demotion check, which degrades
  # to a stated error when no archive is reachable (SO-3). Manual
  # dispatch only (SO-21): the engine never runs on the owner's PC.
  self-improve:
    if: inputs.task == 'self-improve'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      SELF_IMPROVE_PRIOR_TRIALS: ${{ inputs.prior_trials || '0' }}
      # The same relay archive every forward job reaches: the STATUS
      # measure and the demotion check read the finalized sessions
      # through it (SO-5: the token travels as a secret, never a file).
      RELAY_URL: "https://quant-of-rehan-relay.mrmrehanqureshi.workers.dev"
      RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Build the ten-year dataset
        run: |
          mkdir -p data
          python scripts/build_backtest_dataset.py \
            --universe src/data/universe_kmiall.json \
            --start 2016-10-29 \
            --out data/eod_dataset_10y.csv.gz \
            --cache-dir data/mkt_cache

      - name: Run the self-improvement engine
        run: |
          python scripts/self_improve.py \
            --dataset data/eod_dataset_10y.csv.gz \
            --out data/research/self_improve_report.json
          cat data/research/self_improve_report.json

      - name: Keep the search result
        uses: actions/upload-artifact@v7
        with:
          name: self-improve-${{ github.run_id }}
          path: |
            data/research/self_improve_report.json
            data/research/experiments.jsonl
          if-no-files-found: warn
          retention-days: 90

  # Breakthrough 1.0 families 1 and 3, plus the median-only market gate.
  # Research only: no live-law change and no promotion. The panel is built
  # here because `data/` is gitignored; the pre-registration rows are written
  # BEFORE the family runner scores anything. Manual dispatch only (SO-21).
  breakthrough:
    if: inputs.task == 'breakthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      # The panel build is the whole cost of this job: 43 minutes on
      # 2026-11-01 and 46 on 2026-11-04, and the 2026-11-04 run threw that
      # away when one family later raised. The key carries the universe hash
      # and a dated version, so a retry reuses the same measured panel and a
      # deliberate refresh is one word in the key, never a silent drift.
      - name: Restore the ten-year panel
        id: panel
        uses: actions/cache/restore@v4
        with:
          path: data/eod_dataset_10y.csv.gz
          key: eod-10y-${{ hashFiles('src/data/universe_kmiall.json') }}-2016-10-29-v1

      - name: Build the ten-year dataset
        if: steps.panel.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          python scripts/build_backtest_dataset.py \
            --universe src/data/universe_kmiall.json \
            --start 2016-10-29 \
            --out data/eod_dataset_10y.csv.gz \
            --cache-dir data/mkt_cache

      - name: Save the ten-year panel
        if: steps.panel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/eod_dataset_10y.csv.gz
          key: eod-10y-${{ hashFiles('src/data/universe_kmiall.json') }}-2016-10-29-v1

      - name: Pre-register the Breakthrough rows
        run: |
          python scripts/preregister_breakthrough.py
          wc -l data/research/experiments.jsonl

      - name: Run the Breakthrough families
        run: |
          python scripts/breakthrough_families.py \
            --dataset data/eod_dataset_10y.csv.gz \
            --out data/research/breakthrough_families.json
          cat data/research/breakthrough_families.json

      - name: Keep the Breakthrough result
        # always(): a family that raises still leaves the shapes that scored,
        # and the registry rows, in the artifact beside the failure.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: breakthrough-families-${{ github.run_id }}
          path: |
            data/research/breakthrough_families.json
            data/research/experiments.jsonl
          if-no-files-found: error
          retention-days: 90
