name: KMIALL session scan loop

# Owner order 2026-10-19, verbatim: "Update the scanning frequency for the quant
# engine from 30 seconds to real-time (1-second intervals)". This supersedes the
# 30 second order of 2026-10-14 (SO-13). The workflow is unchanged otherwise: it
# runs the supervised loop (scripts/scan_loop.py) for one PSX band, the loop
# keeps the read-only broker tape alive for the whole band, and it scans the
# entire KMIALL universe as often as one cycle allows, feeding the same
# observation the phone's card and the intraday paper strategy read.
#
# What "1 second" can and cannot mean here, measured on the real 2026-10-13
# session tape (44.6 MB, 314 symbols, 56,618 rows): one cycle builds the bars in
# 1.4s, loads them in 1.5s and gates and ranks in under 0.1s, so a cycle costs
# about 2.9s. The requester of a slot is therefore 1 second, but the loop can
# only start the next cycle when this one ends: the achieved cadence is the
# pipeline's own latency, about 3 seconds, with no queued backlog and no busy
# wait. The phone's one second repaint is independent of this and reads the
# newest snapshot the relay holds.
#
# Why four windows instead of one job: a GitHub job may not exceed six hours,
# and Mon-Thu 09:32 to 15:30 is 5h58m before any setup is billed. Each window
# here is under three hours, and the loop pauses in the warm-up, in the Friday
# midday break and outside the session, so a window that starts at a band edge
# and ends at the next one never scans a shut market. The scheduled per-slot
# fires and the post-close finalize in intraday-capture.yml stay as they are:
# they are the backstop if a session job dies mid-band.
#
#   03:55 UTC = 08:55 PKT  Mon-Thu band 1 (window opens 08:55; the loop's
#                          own sleep gate keeps the pre-band minutes off,
#                          and 09:15 to 09:32, the law's morning gap, is
#                          deliberately asleep with it)
#   07:30 UTC = 12:30 PKT  Mon-Thu band 2 (12:30 to 15:30)
#   10:32 UTC = 15:32 PKT  Mon-Thu post-market (15:32 to 15:52)
#   04:17 UTC = 09:17 PKT  Friday band 1 (09:17 to 12:00, midday break after)
#   09:32 UTC = 14:32 PKT  Friday band 2 (14:32 to 16:30)
#   11:32 UTC = 16:32 PKT  Friday post-market (16:32 to 16:52; owner order
#                          2026-10-24, emails the post and post-close edges)
#
# Minutes: GitHub Actions is free on a public repository, and this repository
# is public as of the owner's 2026-10-14 order, so the 2,000-minute private
# allowance that capped the cadence no longer binds. The cost figures above
# are also the reason a 1 second request does not multiply the job's minutes:
# the job already runs for the band's own length, and the loop scans inside
# that window either way.

on:
  schedule:
    - cron: "55 3 * * 1-4"     # 08:55 PKT, Mon-Thu band 1
    - cron: "30 7 * * 1-4"     # 12:30 PKT, Mon-Thu afternoon band
    - cron: "32 10 * * 1-4"    # 15:32 PKT, Mon-Thu post-market
    - cron: "17 4 * * 5"       # 09:17 PKT, Friday session 1
    - cron: "32 9 * * 5"       # 14:32 PKT, Friday session 2
    # Owner order 2026-10-24: Friday's post-market window (16:32 to 16:49)
    # had no loop at all - the band-2 job ends on the 16:30 close's
    # finalize - so the 16:32 post and 16:49 post-close emails depended
    # on GitHub crons that had just staged a mass drop. The same
    # 20-minute post-market window Monday-Thursday already has is
    # mirrored here.
    - cron: "32 11 * * 5"     # 16:32 PKT, Friday post-market
  workflow_dispatch:
    inputs:
      seconds:
        description: "how long to run the loop, in seconds (default 3600)"
        default: "3600"

permissions:
  actions: read
  contents: read
  # Owner order 2026-10-22: the band loop emails the owner the actual call
  # through the watched owner email issue, so the job may write there.
  issues: write

concurrency:
  group: intraday-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      # Owner order 2026-10-24: the token was missing from this job, so
      # the passenger's every send raised (403 permission denied) and
      # the loop emailed NOTHING on the day the events went missing -
      # pre, open, break, reopen, close all silently failed inside
      # scan_loop's passenger. github.token is the workflow's own
      # token; `issues: write` above is already granted.
      GITHUB_TOKEN: ${{ github.token }}
      # Owner defect found 2026-10-28: the loop ran every cycle with "no relay
      # URL configured": src/data/live_card.py (and every other strict
      # resolver) refuses without RELAY_URL, neither a local fallback
      # data/relay_url.txt nor an env var that ever exists on a fresh runner.
      # The URL is public and hardcoded as RELAY_DEFAULT elsewhere; set it so
      # the card, the signals and the research archive push from Actions.
      RELAY_URL: "https://quant-of-rehan-relay.mrmrehanqureshi.workers.dev"
      # Owner order 2026-10-29 ("start sending me signals"): every scan whose
      # rank table is non-empty but whose strict entry law stayed unmatched
      # (or was vetoed by the market) is DELIVERED as an unvalidated CALL
      # WATCH alongside the verdict, instead of an empty channel. The laws
      # are untouched: no position opens, no one-trade claim is taken
      # (src/config.py OWNER_ORDERED_CALLS).
      OWNER_ORDERED_CALLS: "1"
      # The market event emails are the loop's passenger now (owner order
      # 2026-10-23): the phase edges it already decides each second email
      # the owner through the watched issue, so a GitHub cron stall can
      # no longer silence a break, a close or an open.
      OWNER_EMAIL_ISSUE: "81"
      RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
      # Band-state persistence (src/data/band_state.py): the day's tape and
      # session state survive the runner in R2. The same two repo secrets the
      # relay deploy already uses, passed under the names the module reads.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KMIALL_DATA_RIGHTS_CONFIRMED: ${{ vars.KMIALL_DATA_RIGHTS_CONFIRMED }}
      KMIALL_DATA_LATENCY_CONFIRMED: ${{ vars.KMIALL_DATA_LATENCY_CONFIRMED }}
      KMIALL_UNIVERSE_CONFIRMED: ${{ vars.KMIALL_UNIVERSE_CONFIRMED }}
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The same sleep gate the per-slot workflow uses: on a weekend, a PSX
      # holiday or outside every band the job answers and stops without
      # opening a socket, so a misfired schedule costs nothing.
      #
      # The gate is SCHEDULE AWARE, and --force belongs to a human dispatch
      # only (owner audit 2026-10-19). It used to be passed on every fire,
      # which made the gate always answer RUN: a GitHub schedule that arrived
      # hours late started the loop outside the session, finalized the day at
      # 19:11 PKT, then slept 224,435 seconds until the job timeout killed it.
      # That is how a late fire burned 190 runner minutes, skipped every band,
      # and still reported success. A scheduled fire now names its own cron so
      # the gate can decide with the session law, exactly as intraday-capture
      # already does; a manual dispatch keeps the deliberate override.
      - name: Session gate (sleep outside the PSX session)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m src.data.session_gate --check --force --purpose scan
          else
            python -m src.data.session_gate --check \
              --schedule "${{ github.event.schedule }}"
          fi

      # A scheduled fire that GitHub delivered late is a platform fact, not a
      # scanner decision, so say it in the run summary where the owner can see
      # it. The gate above still decides what the fire may do.
      - name: Say when this fire arrived outside the session
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "## Session gate: SLEEP" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This fire did no work: ${{ steps.gate.outputs.reason }}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A scheduled event GitHub delivered late is expected to land " \
            "here; the band itself is covered by the next punctual edge." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt --retries 5 --timeout 60

      - name: Resolve this band's length
        id: window
        if: steps.gate.outputs.should_run == 'true'
        run: |
          # A cron changes only when the runner wakes, never what the loop is
          # allowed to see; the loop itself ends at the band's own close.
          case "${{ github.event.schedule }}" in
            "55 3 * * 1-4") seconds=10860 ;;   # 181 min, ends 12:31
            "30 7 * * 1-4") seconds=10860 ;;   # 181 min, ends 15:31
            "32 10 * * 1-4") seconds=1200 ;;   # 20 min, post-market to 15:52
            "17 4 * * 5")   seconds=9900  ;;   # 165 min, midday break after
            "32 9 * * 5")   seconds=7200  ;;   # 120 min, ends 16:32
            "32 11 * * 5")  seconds=1200 ;;   # 20 min, post-market to 16:52
            *)              seconds="${{ inputs.seconds }}" ;;
          esac
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          echo "this window runs the loop for ${seconds}s of wall clock" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the KMIALL universe at one second intervals for this band
        if: steps.gate.outputs.should_run == 'true'
        run: |
          # set +e: the loop's exit code is reported below and turned into one
          # deduped ops alert, exactly like the scheduled scans, so a band that
          # dies does not become a GitHub failure email per fire.
          set +e
          timeout --signal=TERM \
            "${{ steps.window.outputs.seconds }}" \
            python scripts/scan_loop.py --loop --interval 1 \
            > /tmp/kmi_session.log 2>&1
          status=$?
          set -e
          tail -n 40 /tmp/kmi_session.log
          {
            echo "## KMIALL session loop (exit ${status})"
            echo ""
            echo '```'
            tail -n 12 /tmp/kmi_session.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          from pathlib import Path

          path = Path("data/scan_loop_health.json")
          if not path.is_file():
              print("- the loop wrote no health file")
          else:
              health = json.loads(path.read_text(encoding="utf-8"))
              print("- cycles: " + str(health.get("cycles")))
              print("- scans: " + str(health.get("scans")))
              print("- pauses: " + str(health.get("pauses")))
              print("- failures: " + str(health.get("failures")))
              print("- last verdict: " + str(health.get("last_verdict")))
              print("- last latency ms: " + str(health.get("last_latency_ms")))
          PY
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            python scripts/ops_alert.py --text \
              "Quant of Rehan: the KMIALL session loop stopped early (exit ${status}) after $(grep -c 'cycle ' /tmp/kmi_session.log || true) log lines. The next band retries it; nothing is fabricated and nothing is dropped." || true
          fi

      - name: Keep the band's record
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kmiall-session-loop-${{ github.run_id }}
          path: |
            data/scan_loop_health.json
            data/forward/observation.json
            data/forward/session_state.json
            data/forward/session_journal.jsonl
            logs/scan_loop.log
            logs/feed_capture.log
          if-no-files-found: warn
          retention-days: 90
