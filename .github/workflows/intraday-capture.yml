name: KMIALL intraday momentum scan

# Rebuild 2026-10-09. Karachi is UTC+5 (SO-8), so every cron below is the
# UTC form of a Karachi wall-clock time. Each cron fires a few minutes past
# the hour rather than on it: GitHub documents that the top of every hour is
# a high-load window in which queued schedule events are delayed or dropped
# outright. The DECISION time is still the round slot (a cron offset changes
# only when the runner wakes, never what the scanner is allowed to see).
#
#   05:07 UTC = 10:07 PKT   scan (inside Mon-Thu 09:32-15:30 and Fri 09:17-16:30)
#   06:37 UTC = 11:37 PKT   scan (inside both sessions)
#   08:07 UTC = 13:07 PKT   scan (inside both sessions)
#   09:37 UTC = 14:37 PKT   scan (inside both sessions)
#   11:07 UTC = 16:07 PKT   scan (Friday only, inside the Friday session)
#   10:47 UTC = 15:47 PKT   finalize (Mon-Thu, strictly after the 15:30 close)
#   11:47 UTC = 16:47 PKT   finalize (Friday, strictly after the 16:30 close)
#
# The scan never starts outside the session, and the finalize never starts
# before the close. tests/test_rebuild_schedule.py re-derives every one of
# these conversions and fails the build if a cron ever drifts.
#
# Budget: 25 scheduled fires a week. Only a fire inside a live PSX band does
# real work, and the sleep gate below runs before setup-python, before the pip
# install and before the bar fetch, so a weekend, a holiday and every
# non-session slot bill about one minute instead of eleven.
#
# A working fire used to bill 11 to 14 minutes AND end "cancelled" without ever
# reaching the scan step: one polite pass over the 319 symbol universe needs
# about 12 minutes (741s measured) against a 10 minute job timeout, so the
# fetch was killed and the scan step was skipped every single time. The fetch is
# now bounded at 420s, so a working fire bills about 8 minutes and always
# finishes, and a short capture is reported as a degraded one instead of
# killing the run. Measured figures behind this: AUDIT_AND_CI_BUDGET_2026-10-10.md.

on:
  schedule:
    # Friday (PKT) is two sessions, 09:17-12:00 and 14:32-16:30, with the
    # exchange's midday break in between; the 13:00 scan slot is Mon-Thu
    # only for that reason. See src/data/sessions.py for the one session law.
    - cron: "7 5 * * 1-5"     # 10:07 PKT
    - cron: "37 6 * * 1-5"    # 11:37 PKT
    - cron: "7 8 * * 1-4"     # 13:07 PKT, never on Friday (break)
    - cron: "37 9 * * 1-5"    # 14:37 PKT
    - cron: "7 11 * * 5"      # 16:07 PKT Friday session 2
    - cron: "47 10 * * 1-4"   # 15:47 PKT finalize
    - cron: "47 11 * * 5"     # 16:47 PKT Friday finalize
  workflow_dispatch:
    inputs:
      slot:
        description: "Karachi scan slot, or finalize"
        type: choice
        options:
          - "10:00"
          - "11:30"
          - "13:00"
          - "14:30"
          - "16:00"
          - "finalize"
        default: "10:00"

permissions:
  actions: read
  contents: read

concurrency:
  group: intraday-momentum
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
      KMIALL_DATA_RIGHTS_CONFIRMED: ${{ vars.KMIALL_DATA_RIGHTS_CONFIRMED }}
      KMIALL_DATA_LATENCY_CONFIRMED: ${{ vars.KMIALL_DATA_LATENCY_CONFIRMED }}
      KMIALL_UNIVERSE_CONFIRMED: ${{ vars.KMIALL_UNIVERSE_CONFIRMED }}
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Sleep gate: the cheapest question in the job, and the reason a fire
      # outside the PSX session costs one minute instead of eleven. It runs
      # after checkout and setup-python (so the interpreter is the known one),
      # but BEFORE the pip install and before the twelve minute bar fetch. On a
      # weekend or a PSX holiday it answers without opening a socket at all.
      # SO-8: the session law in src/data/sessions.py decides, and the live
      # dps.psx.com.pk probe only verifies it, so a blocked portal can never
      # silence a session the law calls live.
      - name: Session gate (sleep outside the PSX session)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A human asked for this run, so do not second-guess them.
            if [ "${{ inputs.slot }}" = "finalize" ]; then
              python -m src.data.session_gate --check --force --purpose finalize
            else
              python -m src.data.session_gate --check --force --purpose scan \
                --slot "${{ inputs.slot }}"
            fi
          else
            python -m src.data.session_gate --check \
              --schedule "${{ github.event.schedule }}"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install pandas numpy requests

      - name: Fetch one KMIALL bar pass, inside a budget this job can afford
        if: steps.gate.outputs.should_run == 'true'
        run: |
          # Owner order 2026-10-11 plus the audit of the same day: this job's
          # timeout is 10 minutes, and one polite pass over the 319 symbol
          # universe takes about 12 (741s measured, 319 x 2.32s). Every
          # scheduled run was therefore killed mid-fetch and ended
          # "cancelled" with the scan step skipped: the scan never happened.
          # The pass now stops itself at 420s (7 minutes) and reports what it
          # did not reach, which leaves about three minutes for the scan, the
          # summary and the artifacts inside the timeout. A short pass is a
          # degraded capture and is reported as one; it is never padded or
          # invented.
          mkdir -p data/feed_capture data/forward
          set +e
          python -m src.data.ohlc_poller \
            --symbols-file src/data/universe_kmiall.json --once \
            --deadline-seconds 420 > /tmp/kmi_capture.log 2>&1
          status=$?
          set -e
          cat /tmp/kmi_capture.log
          if [ "$status" -ne 0 ]; then
            # Owner order 2026-10-08: a degraded capture must not turn the
            # scheduled run red. Exit 3 means the pass stopped at its own
            # budget; a coverage shortfall leaves the low-coverage flag behind.
            # Both are reported ONCE per day by the capture-health alert below,
            # and the scan step still sees the thin capture and reports it as
            # DATA_BLOCKED rather than inventing a market verdict.
            {
              echo "## Capture degraded (exit ${status})"
              echo ""
              echo '```'
              tr -d '\r' < /tmp/kmi_capture.log | tail -n 6
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan the whole KMIALL universe, or finalize the session
        if: steps.gate.outputs.should_run == 'true'
        run: |
          # The gate already resolved which of the two this fire is, from the
          # cron that fired (SCHEDULE_PLAN in src/data/session_gate.py), so
          # this step keeps no schedule table of its own. Friday's 13:07 PKT
          # slot is Mon-Thu only because it falls inside the exchange's midday
          # break (12:00 to 14:32); Friday's afternoon coverage is 14:37.
          #
          # Owner order 2026-10-08, applied here exactly as it already is in
          # the daily push: a scheduled run stays GREEN and a failure raises
          # ONE deduped Telegram ops alert carrying the reason, instead of a
          # GitHub failure email for every fire. Nothing is hidden: the reason
          # is printed, written to the run summary (readable even when the
          # relay itself is what is broken) and sent to the owner's phone.
          run_and_report() {
            set +e
            "$@" > /tmp/kmi_scan.log 2>&1
            status=$?
            set -e
            cat /tmp/kmi_scan.log
            if [ "$status" -ne 0 ]; then
              reason=$(tr -d '\r' < /tmp/kmi_scan.log | grep -v '^$' | tail -n 4)
              {
                echo "## KMIALL ${MODE} failed (exit ${status})"
                echo ""
                echo '```'
                echo "${reason}"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              python scripts/ops_alert.py --text "Quant of Rehan: the scheduled KMIALL ${MODE} failed (exit ${status}). Reason: ${reason} The next scheduled slot retries it; nothing is fabricated and nothing is dropped." || true
            fi
          }
          if [ "${{ steps.gate.outputs.purpose }}" = "finalize" ]; then
            MODE=finalize
            run_and_report python scripts/intraday_pipeline.py --finalize
          else
            MODE=scan
            run_and_report python scripts/intraday_pipeline.py --scan \
              --slot "${{ steps.gate.outputs.slot }}"
          fi

      - name: Ops alert if the capture was degraded (deduped, one per day)
        if: always() && steps.gate.outputs.should_run == 'true'
        run: python scripts/ops_alert.py --capture-health

      - name: Summarize the scan
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/forward/observation.json")
          if not path.exists():
              summary = "No observation was produced. Check the failed run."
          else:
              snap = json.loads(path.read_text(encoding="utf-8"))
              quality = snap.get("data_quality", {})
              state = snap.get("trade_state", {})
              lines = [
                  f"Status: {snap.get('status')}",
                  f"Slot: {snap.get('slot')}",
                  f"Reason: {snap.get('reason')}",
                  f"KMIALL coverage: {quality.get('symbols_with_bars')}/"
                  f"{quality.get('symbols_expected')} "
                  f"({quality.get('coverage')})",
                  f"Volume available: {quality.get('volume_available')}",
                  f"Eligible candidates: {snap.get('eligible_count')}",
                  f"Trade state: {state.get('state')}",
                  f"Trades taken today: {state.get('trades_today')}",
              ]
              candidate = snap.get("candidate")
              if candidate:
                  lines.append(
                      f"Candidate: {candidate.get('symbol')} score "
                      f"{candidate.get('score')}")
              summary = "\n".join(f"- {line}" for line in lines)
          with open(Path(os.environ["GITHUB_STEP_SUMMARY"]), "a",
                    encoding="utf-8") as output:
              output.write("## KMIALL momentum scan\n\n" + summary + "\n")
          PY

      - name: Retain the session record, gate and captured bars
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kmiall-session-${{ github.run_id }}
          path: |
            data/forward/observation.json
            data/forward/daily_outcome.json
            data/forward/production_gate.json
            data/forward/session_journal.jsonl
            data/forward/session_state.json
            data/feed_capture/ohlc_*.ndjson
            data/feed_capture/ohlc_status.json
          if-no-files-found: warn
          retention-days: 90
