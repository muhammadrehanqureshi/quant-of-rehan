name: daily KMIALL intraday capture

# UTC+5 schedule: 10:45, 12:45 Mon-Thu, 14:45, and 16:45 PKT.
# Friday's split-session break skips 12:45. Scans deliver clearly labeled
# paper observations; production messages remain gated by frozen evidence.
# At most 92
# runs x 15 minutes = 1,380 minutes in a
# 23-weekday month. The daily signal workflow is capped at 460 more minutes,
# for a scheduled maximum of 1,840 within the 2,000-minute monthly budget.
on:
  schedule:
    - cron: "45 5 * * 1-5"
    - cron: "45 7 * * 1-4"
    - cron: "45 9 * * 1-5"
    - cron: "45 11 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Karachi scan time"
        type: choice
        options:
          - "10:45"
          - "12:45"
          - "14:45"
          - "16:45"
        default: "10:45"

permissions:
  actions: read
  contents: read

concurrency:
  group: intraday-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
      KMIALL_DATA_RIGHTS_CONFIRMED: ${{ vars.KMIALL_DATA_RIGHTS_CONFIRMED }}
      KMIALL_DATA_LATENCY_CONFIRMED: ${{ vars.KMIALL_DATA_LATENCY_CONFIRMED }}
      KMIALL_UNIVERSE_CONFIRMED: ${{ vars.KMIALL_UNIVERSE_CONFIRMED }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install capture and research dependencies
        run: pip install pandas numpy requests

      - name: Fetch one complete KMIALL bar pass
        run: |
          mkdir -p data/feed_capture
          python -m src.data.ohlc_poller --symbols-file src/data/universe_kmiall.json --once

      - name: Scan causally or finalize forward outcome
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "45 5 * * 1-5") SLOT="10:45" ;;
              "45 7 * * 1-5") SLOT="12:45" ;;
              "45 9 * * 1-5") SLOT="14:45" ;;
              "45 11 * * 1-5") SLOT="16:45" ;;
              *) echo "Unknown schedule slot"; exit 2 ;;
            esac
          fi
          if [ "$SLOT" = "16:45" ]; then
            python scripts/intraday_pipeline.py --finalize
          else
            python scripts/intraday_pipeline.py --scan --slot "$SLOT"
          fi

      - name: Retain paper observation
        if: success() && github.event_name == 'schedule' && github.event.schedule != '45 11 * * 1-5' || success() && github.event_name == 'workflow_dispatch' && inputs.slot != '16:45'
        uses: actions/upload-artifact@v4
        with:
          name: kmiall-observation-${{ github.run_id }}
          path: data/forward/observation.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain daily forward-validation result
        if: success() && github.event.schedule == '45 11 * * 1-5' || success() && github.event_name == 'workflow_dispatch' && inputs.slot == '16:45'
        uses: actions/upload-artifact@v4
        with:
          name: kmiall-forward-${{ github.run_id }}
          path: |
            data/forward/daily_outcome.json
            data/forward/production_gate.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize capture
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/feed_capture/ohlc_status.json")
          if not path.exists():
              summary = "Capture status was not produced. Check the failed run."
          else:
              status = json.loads(path.read_text(encoding="utf-8"))
              counters = status.get("counters", {})
              summary = (
                  f"Date: {status.get('started_at', 'unknown')}\n\n"
                  f"Symbols with data: {counters.get('symbols_ok', 0)}\n\n"
                  f"Symbols without data: {counters.get('symbols_err', 0)}\n\n"
                  f"One-minute bars banked: {counters.get('bars', 0)}\n\n"
                  f"Errors: {counters.get('errors', 0)}"
              )
          with open(Path(os.environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as output:
              output.write("## Intraday capture\n\n" + summary + "\n")
          PY

      - name: Retain captured bars and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmiall-intraday-${{ github.run_id }}
          path: |
            data/feed_capture/ohlc_*.ndjson
            data/feed_capture/ohlc_status.json
          if-no-files-found: warn
          retention-days: 90

