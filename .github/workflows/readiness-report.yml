name: Session readiness report

# Owner order 2026-11-20: "check if the quant of Rehan is ready for today's
# pre/live and post market. Make sure cloudflare and github actions/crons are
# working. You didn't scan the post market yesterday."
#
# The 2026-11-19 report: the relay deployed and answered, but between 13:11 and
# 17:07 PKT no scan run was created at all, so the 15:32 to 15:49 post-market
# window and its 15:47 finalize both left no run and the day's last prices were
# never refreshed. This job makes that visible on the day it happens: it prints
# the relay's own answer, the store's freshness, and every scan run started
# today, and it names each band edge that left no run within 25 minutes.
#
# Owner order 2026-11-24: "Also, you didn't scan the post market yesterday."
# The 08:52 fire of 2026-11-24 was delivered by GitHub at 03:16 PKT, and it
# computed its day from the clock: it audited the NEW Karachi day, printed
# PENDING for all four of that day's edges, and said nothing about the
# post-market that had just closed. A report that cannot answer the question
# it exists for is the defect this file now fixes: the audit names the last day
# whose post-market has closed, and an edge counts as covered by a run that was
# still in flight across it (the 15:32 band loop carries the 15:47 finalize).
#
# It prints to stdout, not only to the job summary, so `gh run view --log` shows
# the whole answer. It never mails the owner and never touches the store.

on:
  schedule:
    - cron: "52 3 * * 1-5"    # 08:52 PKT, before the 08:55 warm-up
    - cron: "52 10 * * 1-4"   # 15:52 PKT, after the Mon-Thu post-market
    - cron: "52 11 * * 5"     # 16:52 PKT, after Friday's post-market
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --retries 5 --timeout 60

      # Owner report 2026-11-20: yesterday's post-market left no run because
      # the relay's own dispatch answered 401 Bad credentials, and nothing said
      # so until the next morning. The 401 is the one failure that silently
      # removes the backup path, so this reads the token once a run. It never
      # dispatches anything: a GET on the workflow list only proves the token
      # can still reach the endpoint the relay posts to.
      - name: Check the relay's dispatch token
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_DISPATCH_TOKEN:-}" ]; then
            echo "DISPATCH TOKEN missing: the GH_DISPATCH_TOKEN repository secret is empty"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "accept: application/vnd.github+json" \
            -H "x-github-api-version: 2022-11-28" \
            -H "user-agent: quant-of-rehan-relay" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/intraday-session.yml")
          case "$code" in
            200) echo "DISPATCH TOKEN ok: the relay can still start a band" ;;
            401) echo "DISPATCH TOKEN EXPIRED: HTTP 401, so the relay's band dispatch cannot start anything and only GitHub's own schedule and the session failsafe remain. Renew the PAT and run Bind the relay's dispatch token." ;;
            *) echo "DISPATCH TOKEN unproven: HTTP $code from the workflow read" ;;
          esac

      - name: Read the relay, the store and the day's runs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo

          from src.data.relay_http import read_json
          from src.data.sessions import (band_bounds, close_time, is_trading_day,
                                         open_time, session_bands)

          BASE = "https://quant-of-rehan-relay.mrmrehanqureshi.workers.dev"
          PKT = ZoneInfo("Asia/Karachi")
          now = datetime.now(PKT)
          day = now.date()
          print(f"KARACHI NOW   {now:%Y-%m-%d %H:%M:%S} PKT ({now:%A})")
          print(f"TRADING DAY   {is_trading_day(day)}  "
                f"open {open_time(day)[0]:02d}:{open_time(day)[1]:02d}  "
                f"close {close_time(day)[0]:02d}:{close_time(day)[1]:02d}")

          health, trouble = read_json(BASE, "/health", attempts=3)
          if health is None:
              print(f"RELAY         DOWN: /health did not answer ({trouble})")
              raise SystemExit(0)
          state = health.get("market_state") or {}
          print("RELAY         " + json.dumps({
              "version": health.get("version"),
              "phase": state.get("phase"),
              "trading_day": state.get("trading_day"),
              "relay_clock": health.get("karachi_now"),
          }, sort_keys=True))
          print("DISPATCH      " + json.dumps(health.get("last_dispatch"),
                                             sort_keys=True))

          quotes, trouble = read_json(BASE, "/quotes", attempts=3)
          if quotes is None:
              print(f"QUOTES        unreadable ({trouble})")
          else:
              rows = quotes.get("quotes") or []
              priced = [row for row in rows if (row.get("volume") or 0) > 0]
              stamps = sorted(str(row.get("observed_at") or row.get("at") or "")
                              for row in rows)
              print("QUOTES        " + json.dumps({
                  "updated_at": quotes.get("updated_at"),
                  "stale": quotes.get("stale"),
                  "rows": len(rows),
                  "with_volume": len(priced),
                  "newest_stamp": stamps[-1] if stamps else "",
              }, sort_keys=True))

          market, trouble = read_json(BASE, "/market", attempts=3)
          if market is None:
              print(f"MARKET        unreadable ({trouble})")
          else:
              print("MARKET        " + json.dumps({
                  "market_feed": market.get("market_feed"),
                  "win_loss": market.get("win_loss"),
              }, sort_keys=True))

          # Owner order 2026-11-24: the audit names the last day whose
          # post-market has closed, not whatever the clock reads. At 08:52 that
          # is yesterday, at 15:52 it is today, and a fire delivered after
          # midnight still reports on the session it was meant to audit.
          audit_day = day
          for back in range(0, 8):
              candidate = day - timedelta(days=back)
              if not is_trading_day(candidate):
                  continue
              closes = band_bounds(candidate, session_bands(candidate)[-1])[1]
              if candidate != day or now >= closes + timedelta(minutes=17):
                  audit_day = candidate
                  break
          print(f"AUDIT DAY     {audit_day} PKT session "
                f"(the Karachi date now is {day})")

          # Each loop workflow is listed on its own. A repository-wide list of
          # 100 runs does not reach back to yesterday morning on a push-heavy
          # day (the 08:55 band of 2026-11-23 fell off the list and the first
          # audit read it as MISSING while the run existed). Owner order
          # 2026-11-24.
          runs = []
          for workflow in ("intraday-session.yml", "intraday-capture.yml"):
              raw = subprocess.run(
                  ["gh", "run", "list", "--workflow", workflow,
                   "--limit", "40", "--json",
                   "workflowName,createdAt,startedAt,updatedAt,conclusion,status"],
                  capture_output=True, text=True, check=True).stdout
              for run in json.loads(raw):
                  at = datetime.fromisoformat(
                      run["createdAt"].replace("Z", "+00:00")).astimezone(PKT)
                  if at.date() < audit_day:
                      continue
                  print(f"RUN           {at:%Y-%m-%d %H:%M} PKT  "
                        f"{run['workflowName']:<32} {run.get('status')} "
                        f"{run.get('conclusion') or ''}")
                  ended = run.get("updatedAt") or run.get("startedAt")
                  end = (datetime.fromisoformat(ended.replace("Z", "+00:00"))
                         .astimezone(PKT) if ended else None)
                  runs.append((at, end, run["workflowName"],
                               run.get("conclusion") or ""))
          runs.sort(key=lambda row: row[0], reverse=True)

          bands = session_bands(audit_day)
          # Owner audit 2026-11-23: run 44800521311 was the Friday 16:52 fire,
          # delivered by GitHub at 00:16 on Saturday. This block then indexed
          # an empty band list and died with IndexError, so a closed day read
          # as a broken report. A date with no session has no edge to check.
          if not bands:
              print(f"BANDS         none: {audit_day} is not a PSX trading "
                    "day, so there is no session edge to check")
              raise SystemExit(0)
          edges = [("warm-up 08:55",
                    datetime.combine(audit_day, time(8, 55), PKT)),
                   ("pre-open 09:20",
                    datetime.combine(audit_day, time(9, 20), PKT))]
          for band in bands:
              start, _end = band_bounds(audit_day, band)
              edges.append((f"band open {start:%H:%M}", start))
          last_close = band_bounds(audit_day, bands[-1])[1]
          edges.append((f"post-market {last_close:%H:%M}+2",
                        last_close + timedelta(minutes=2)))
          edges.append((f"finalize {last_close:%H:%M}+17",
                        last_close + timedelta(minutes=17)))
          for label, when in edges:
              if when > now:
                  print(f"PENDING       {label}: not due yet")
                  continue
              # A run covers an edge when it started near it, or when it was
              # still running across it: the 15:32 band loop finalizes the day
              # at 15:49, so the 15:47 finalize edge is covered with no run of
              # its own. Owner order 2026-11-24.
              # A cancelled run scanned nothing, so it is never coverage: the
              # first audit credited the 08:55 warm-up of 2026-11-23 to a
              # cancelled 09:15 run and would have called a silent window OK.
              # The nearest live run wins. Owner order 2026-11-24.
              hit = None
              for at, end, name, state in runs:
                  if state == "cancelled":
                      continue
                  gap = at - when
                  near = timedelta(minutes=-5) <= gap <= timedelta(minutes=25)
                  across = at <= when and (end is None or end >= when)
                  if not (near or across):
                      continue
                  rank = abs(gap) if near else timedelta(days=999)
                  if hit is None or rank < hit[0]:
                      hit = (rank, at, name, near)
              if hit is None:
                  print(f"MISSING       {label}: no live scan run started near "
                        "the edge and none was in flight across it")
              elif hit[3]:
                  print(f"OK            {label}: {hit[2]} started "
                        f"{hit[1]:%H:%M} PKT")
              else:
                  print(f"OK            {label}: {hit[2]} in flight across "
                        "the edge")

          # The minute bars are the hard evidence that the window itself was
          # captured, whatever the run names say. Owner order 2026-11-24.
          history, trouble = read_json(BASE, "/history", attempts=3)
          if history is None:
              print(f"TAPE          unreadable ({trouble})")
          else:
              rows = [row for row in (history.get("days") or [])
                      if str(row.get("day")) == audit_day.isoformat()]
              opens = (last_close + timedelta(minutes=2)).strftime("%H:%M")
              if not rows:
                  print(f"TAPE          no minute-bar row for {audit_day}, so "
                        "the session left nothing to audit")
              else:
                  last = str(rows[0].get("last") or "")
                  print("TAPE          " + json.dumps({
                      "day": rows[0].get("day"),
                      "minutes": rows[0].get("minutes"),
                      "first": rows[0].get("first"),
                      "last": last,
                      "post_market_opens": opens,
                      "post_market_captured": bool(last) and last >= opens,
                  }, sort_keys=True))
          PY
