# Daily signal push (SO-10, owner approval 2026-10-07).
#
# Runs the quant's post-close signal search on GitHub Actions so the PC
# never hosts a daemon: fetch a bounded trailing EOD window from the PSX
# portal (the CI guard in scripts/build_eod_history.py refuses anything
# larger), compute the engine's verdict for the newest session, and push
# it to the relay (phone app + Telegram). Failures fail closed; nothing is
# ever sent twice (per-session journal inside the cached workspace data).
#
# Schedule (UTC, Karachi = UTC+5, SO-8):
#   13:45 Mon-Thu = 18:45 PKT, after the 15:30 close
#   14:45 Fri     = 19:45 PKT, after the 16:30 close
#   03:45 Tue-Sat = 08:45 PKT safety net, before the 09:32/09:17 open
#
# Budget: up to 46 scheduled runs/month, capped at 10 minutes each.
# Combined with intraday capture, scheduled ceilings are 1,840 minutes/month.

name: daily signal push

on:
  schedule:
    - cron: "45 13 * * 1-4"
    - cron: "45 14 * * 5"
    - cron: "45 3 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the verdict, send nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: signal-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Fetch window, compute verdict, push
        run: |
          mkdir -p data
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python scripts/signal_daily.py $ARGS

      - name: Upload the push journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-push-journal-${{ github.run_id }}
          path: data/signal_push_log.jsonl
          if-no-files-found: ignore
