# Daily signal push (SO-10, owner approval 2026-10-07).
#
# Runs the cloud-hosted daily status job so the PC never needs to be on:
# fetch a bounded trailing EOD window from the PSX portal and deliver the
# fail-closed NO TRADE ENGINE READY status to the app and Telegram. Signal
# candidates remain disabled until a strategy passes economic validation.
# Failures fail closed; the per-session journal prevents duplicate sends.
#
# Schedule (UTC, Karachi = UTC+5, SO-8):
#   13:45 Mon-Thu = 18:45 PKT, after the 15:30 close
#   14:45 Fri     = 19:45 PKT, after the 16:30 close
#   03:45 Tue-Sat = 08:45 PKT safety net, before the 09:32/09:17 open
#
# Budget: up to 46 scheduled runs/month, capped at 10 minutes each.
# Combined with intraday capture, scheduled ceilings are 1,840 minutes/month.

name: daily signal push

on:
  schedule:
    - cron: "45 13 * * 1-4"
    - cron: "45 14 * * 5"
    - cron: "45 3 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the verdict, send nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: signal-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Fetch window and push NO TRADE status
        run: |
          mkdir -p data
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          # Owner order 2026-10-08: keep the scheduled run green; a failed
          # push raises ONE deduped Telegram ops alert instead of a GitHub
          # failure email. The next cron slot retries automatically (the
          # per-session journal prevents double sends).
          #
          # Owner bug report, 2026-10-10: the alert used to say only that the
          # push had failed, so the cause lived in a GitHub log the owner
          # never opens. The job output is now captured, the reason travels
          # with the alert, and the same reason is written to the run summary
          # (which is readable even when the relay itself is the thing that
          # is broken and no Telegram message can be delivered).
          set +e
          python scripts/signal_daily.py $ARGS > /tmp/signal_push.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/signal_push.log
          REASON=$(tr -d '\r' < /tmp/signal_push.log | grep -v '^$' | tail -n 4)
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## Daily signal push failed"
              echo ""
              echo '```'
              echo "${REASON}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python scripts/ops_alert.py --text "Quant of Rehan: the daily signal push failed this slot. Reason: ${REASON} It retries at the next scheduled run; nothing is sent twice." || true
          fi

      - name: Keep the job output regardless of the outcome
        if: always()
        run: |
          cp /tmp/signal_push.log data/signal_push_run.log 2>/dev/null || true

      - name: Upload the push journal and this run's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-push-journal-${{ github.run_id }}
          path: |
            data/signal_push_log.jsonl
            data/signal_push_run.log
          if-no-files-found: ignore
