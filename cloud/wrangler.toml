# Wrangler config for the quant-of-rehan Telegram relay.
# Deploy: npx wrangler deploy (then: npx wrangler secret put TELEGRAM_BOT_TOKEN)

name = "quant-of-rehan-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

# SO-8: Workers crons run on UTC; the worker converts to Karachi (UTC+5)
# internally and re-checks the schedule edge before firing, so a one-minute
# cron drift still sends exactly one notification per event.
#
# Friday is two sessions with a midday break, so it has four edges. Workers
# Free allows only 5 cron triggers per ACCOUNT, so the four Friday edges are
# packed into one expression instead of four: `0,32 7,9 * * 5` fires at the
# 12:00 PKT close and the 14:32 PKT reopen, plus two harmless extra fires
# (07:32 and 09:00 UTC) that the worker's edge check discards without sending.
# A six entry list is rejected outright by Cloudflare (error 10072).
#
# The worker's band table (worker.js) is the same table
# src/data/sessions.py computes, and the parity test fails if they drift.
#
# 04:32 UTC = 09:32 PKT (Mon-Thu open)
# 07:30 UTC = 12:30 PKT (Mon-Thu AFTERNOON dispatch edge: the session loop
#   started at the 09:32 open ends at 12:30, so without this wake the
#   afternoon had no publisher and the phone's numbers froze, measured
#   2026-10-20. Not a notification edge; the dispatch's own dedupe key
#   separates it from the morning loop).
# 07:00 UTC = 12:00 PKT (Friday session 1 close, midday break begins)
# 09:32 UTC = 14:32 PKT (Friday session 2 open, trading resumes)
# 10:30 UTC = 15:30 PKT (Mon-Thu close)
# 11:30 UTC = 16:30 PKT (Friday session 2 close)
[triggers]
crons = [
  "32 4 * * 1-4",
  "30 7 * * 1-4",
  "17 4 * * 5",
  "32 9 * * 5",
  "0,30 7,10,11 * * 1-5",
]

# No KV namespace, on purpose. Owner order 2026-10-20: no product that
# mails a quota warning stays in the path, and KV was the one mailing it
# ("daily limit reached 50%"). Everything the relay stores lives in the
# QuoteHub Durable Object below, whose storage is not metered per write.
# A binding to a namespace that no longer exists also failed every deploy,
# which is why the edge ran a stale build from 2026-10-19.

[[durable_objects.bindings]]
name = "QUOTE_HUB"
class_name = "QuoteHub"

[exports.QuoteHub]
type = "durable-object"
storage = "sqlite"
