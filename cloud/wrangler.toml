# Wrangler config for the quant-of-rehan relay.
# Deploy: npx wrangler deploy (the RELAY_ADMIN_TOKEN binding is managed by
# cloud/pair.py; the chat binding is retired, owner order 2026-10-29)

name = "quant-of-rehan-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

# SO-8: Workers crons run on UTC; the worker converts to Karachi (UTC+5)
# internally and re-checks the schedule edge before firing, so a one-minute
# cron drift still sends exactly one notification per event.
#
# Friday is two sessions with a midday break. The 08:55 PKT pre-open
# recorder warm-up shares a packed cron with the 09:17 PKT band open, so the
# capture starts before the 09:00 auction and the edge still has a fire; the
# extra minutes in that expression are discarded by the worker's edge check.
# The second session does the same from 14:10 to its 14:32 open.
# Workers Free allows only 5 cron triggers per ACCOUNT, so the remaining
# Friday edges share the close/post-close expression below. A six entry list
# is rejected outright by Cloudflare (error 10072).
#
# The worker's band table (worker.js) is the same table
# src/data/sessions.py computes, and the parity test fails if they drift.
#
# 03:55/04:32 UTC = 08:55/09:32 PKT (Mon-Thu: the 08:55 recorder warm-up
#   starts the capture before the first trade; the exchange's pre-open window
#   is 09:15 to 09:30, and 09:32 is the band-open notification edge)
# 04:20/04:25 UTC = 09:20/09:25 PKT (Mon-Thu pre-open retries: if the 08:55
#   dispatch was lost, the watchdog starts the capture inside the 09:15 to
#   09:30 pre-open, where the zero gate still seeds the day at zero)
# 04:05/04:10 UTC = 09:05/09:10 PKT (Friday pre-open retries inside 09:00 to
#   09:15)
# 09:20/09:25 UTC = 14:20/14:25 PKT (Friday second pre-open retries inside
#   14:15 to 14:30)
# 07:30 UTC = 12:30 PKT (Mon-Thu AFTERNOON dispatch edge: the session loop
#   started at the 08:55 warm-up ends at 12:30, so without this
#   wake the afternoon had no publisher and the phone's numbers froze,
#   measured 2026-10-20. Not a notification edge; the dispatch's own
#   dedupe key separates it from the morning loop).
# 10:33 UTC = 15:33 PKT (Mon-Thu post-market window wake: the quant scans
#   from 15:32 to 15:49, the feed's last post-close print)
# 03:55 UTC = 08:55 PKT (Friday pre-open recorder warm-up; owner order
#   2026-11-13: the capture starts five minutes before the exchange's 09:00
#   pre-open, so no pre-market print is missed. The same expression also
#   fires at 08:05/08:10/08:17, which the worker discards, and carries the
#   09:05/09:10 retries)
# 04:17 UTC = 09:17 PKT (Friday session 1 open, packed with the warm-up)
# 07:00 UTC = 12:00 PKT (Friday session 1 close, midday break begins)
# 09:10 UTC = 14:10 PKT (Friday session 2 pre-open recorder warm-up; the band
#   opens at 14:32, packed with the warm-up)
# 09:32 UTC = 14:32 PKT (Friday session 2 open, trading resumes)
# 11:33 UTC = 16:33 PKT (Friday post-market window wake: 16:32 to 16:49)
# 10:40/10:45 UTC = 15:40/15:45 PKT (Mon-Thu post-market retries inside
#   15:32 to 15:49)
# 11:40/11:45 UTC = 16:40/16:45 PKT (Friday post-market retries inside
#   16:32 to 16:49)
# packed edge list fires at the 12:00 PKT Friday close, the 15:30 Mon-Thu
# close and the 16:30 PKT Friday close plus harmless extras the worker
# discards; a six entry list is rejected (Cloudflare error 10072).
[triggers]
crons = [
  "15,20,25,32 4 * * 1-4",
  "30 7 * * 1-4",
  "55,5,10,17 3,4 * * 5",
  "10,20,25,32 9 * * 5",
  "0,30,33,40,45 7,10,11 * * 1-5",
]

# No KV namespace, on purpose. Owner order 2026-10-20: no product that
# mails a quota warning stays in the path, and KV was the one mailing it
# ("daily limit reached 50%"). Everything the relay stores lives in the
# QuoteHub Durable Object below, whose storage is not metered per write.
# A binding to a namespace that no longer exists also failed every deploy,
# which is why the edge ran a stale build from 2026-10-19.

[[durable_objects.bindings]]
name = "QUOTE_HUB"
class_name = "QuoteHub"

[exports.QuoteHub]
type = "durable-object"
storage = "sqlite"
